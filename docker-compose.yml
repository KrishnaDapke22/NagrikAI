version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: nagrikai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nagrikai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nagrikai_password}
      POSTGRES_DB: ${POSTGRES_DB:-nagrikai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nagrikai_user -d nagrikai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nagrikai-backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://nagrikai_user:nagrikai_password@db:5432/nagrikai_db}
      - JWT_SECRET=${JWT_SECRET:-nagrikai_development_jwt_secret_key_32bytes_min!}
      - LLM_PROVIDER=local
      - APP_ENV=production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nagrikai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
